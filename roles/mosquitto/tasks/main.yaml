---
- name: Install the Mosquitto package
  ansible.builtin.package:
    name: mosquitto
    state: present
  become: true

- name: Configure the Mosquitto package
  ansible.builtin.template:
    src: templates/mosquitto.conf.j2
    dest: /usr/pkg/etc/mosquitto.conf
  become: true

- name: Configure the Mosquitto users
  ansible.builtin.template:
    src: templates/mosquitto_pwfile.j2
    dest: /usr/pkg/etc/mosquitto_pwfile
  become: true

- name: Copy startup script
  ansible.builtin.copy:
    src: /usr/pkg/share/examples/rc.d/mosquitto
    dest: /etc/rc.d/mosquitto
  become: true

- name: Ensure Mosquitto is enabled on startup
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^mosquitto='
    line: mosquitto=YES
  become: true
