---
- name: Include tasks for NetBSD
  import_tasks: netbsd.yaml
  when: ansible_facts['os_family']|lower == 'netbsd'

- name: Include tasks for RaspberryPI
  import_tasks: rpi.yaml
  when: ansible_facts['os_family']|lower == 'rasberrypios'

