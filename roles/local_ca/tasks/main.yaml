---
- name: LOCAL Create CA Key if not existing
  local_action: community.crypto.openssl_privatekey
  args:
    path: "{{ certificate_directory }}/ca_private.key"
    type: "{{ certificate_type }}"
    size: "{{ certificate_size }}"
    format_mismatch: convert
    regenerate: never

- name: LOCAL Create CA CSR if not existing
  local_action: community.crypto.openssl_csr
  args:
    path: "{{ certificate_directory }}/ca_request.csr"
    privatekey_path: "{{ certificate_directory }}/ca_private.key"
    country_name: "{{ certificate_country }}"
    organization_name: "{{ certificate_organization }}"
    email_address: "{{ certificate_email }}"
    common_name: "{{ certificate_common_name }}"
    create_subject_key_identifier: true
    basicConstraints:
      - "CA:TRUE"
      - "pathlen:1"
    basic_constraints_critical: true
    keyUsage:
      - "digitalSignature"
      - "cRLSign"
      - "keyCertSign"
    key_usage_critical: true

- name: LOCAL Create CA Certificate if not existing
  local_action: community.crypto.x509_certificate
  args:
    path: "{{ certificate_directory }}/ca_certificate.crt"
    privatekey_path: "{{ certificate_directory }}/ca_private.key"
    csr_path: "{{ certificate_directory }}/ca_request.csr"
    provider: selfsigned
    selfsigned_not_before: "+0s"
    selfsigned_not_after: "+3650d"
